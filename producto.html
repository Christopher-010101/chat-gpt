<!doctype html>

<html lang="es">
  <head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Detalles, disponibilidad y opiniones de clientes de D'Paniagua Technology.">
<title>Detalles del producto | D'Paniagua Technology</title>
<link rel="icon" href="assets/img/logo.svg">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/productos.css">
<link rel="stylesheet" href="css/producto-detalle.css">
  </head>

  <body>
    <header class="site-header solid">
      <div class="container nav-wrap">
<a class="brand" href="index.html"><img src="assets/img/logo.svg" alt="D'Paniagua Technology"></a>
<button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
        <nav class="nav-links" id="navLinks">
<a href="index.html">Inicio</a><a href="celulares.html">Celulares</a><a href="laptops.html">Laptops</a><a href="tablets.html">Tablets</a><a href="televisores.html">TV</a><a href="electrodomesticos.html">Hogar</a><a href="accesorios.html">Accesorios</a><a href="ofertas.html">Ofertas</a><a href="resenas.html">Reseñas</a><a href="contacto.html">Contacto</a>
        </nav>

        <div class="nav-actions"><a class="login-link small" href="login.html">Entrar</a><a class="icon-btn" href="carrito.html" aria-label="Carrito">🛒<span class="cart-count" data-cart-count>0</span></a>
        </div>

      </div>
    </header>

    <main class="product-detail-page">
      <div class="container">
        <p class="breadcrumb"><a href="index.html">Inicio</a> / <span id="detailCategory">Producto</span>
        </p>

        <div id="productDetail" class="detail-loading">Cargando producto…
        </div>

        <section class="detail-reviews" id="reviewsSection">
          <div class="section-head">
            <div><span class="eyebrow">Opiniones reales</span>
              <h2>Reseñas de este producto
              </h2>
            </div>
          </div>

          <div id="reviewSummary" class="review-summary">
          </div>

          <div id="reviewList" class="review-list">
            <p class="small">Cargando reseñas…
            </p>
          </div>

          <div class="review-form-panel">
            <h3>Escribe tu opinión
            </h3>

            <div id="reviewAuthMessage" class="review-auth-message">Comprobando tu sesión…
            </div>

            <form id="productReviewForm">
              <label for="reviewRating">Calificación
              </label>

<select id="reviewRating" name="rating" required><option value="5">★★★★★ · 5 estrellas</option><option value="4">★★★★☆ · 4 estrellas</option><option value="3">★★★☆☆ · 3 estrellas</option><option value="2">★★☆☆☆ · 2 estrellas</option><option value="1">★☆☆☆☆ · 1 estrella</option></select>
              <label for="reviewBody">Tu comentario
              </label>

<textarea id="reviewBody" name="body" minlength="10" maxlength="1200" required placeholder="Cuéntanos tu experiencia con este producto (mínimo 10 caracteres)"></textarea>
<button class="primary" id="submitReview" type="submit">Publicar reseña</button>
            </form>

          </div>

        </section>

      </div>

    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom"><span>© <span id="year"></span> D'Paniagua Technology</span><a href="contacto.html">Contacto</a>
        </div>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite">
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script><script src="js/catalogo-demo.js"></script><script src="js/global.js"></script><script src="js/carrito.js"></script><script src="js/producto-detalle.js"></script>
  </body>
</html>
